name: simple_live_core
version: 1.0.3
description: "聚合直播核心库"
repository: https://github.com/xiaoyaocz/dart_simple_live
publish_to: "none"
environment: 
  sdk: '>=3.10.0'

dependencies: 
  dio: ^5.5.0+1
  logger: ^2.4.0
  web_socket_channel: ^3.0.1
  html_unescape: ^2.0.0
  protobuf: ^3.1.0
  crypto: ^3.0.3
  brotli: ^0.6.0
  tars_dart:
    path: ./packages/tars_dart
  fixnum: ^1.1.0
  wasm_run: ^0.2.0+2
  dart_quickjs:
    git:
      url: https://github.com/xiaoyaocz/dart_quickjs

dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0
  fake_async: ^1.3.1

# wasm_run 0.2.0+2 的预编译动态库按 flutter_rust_bridge 2.12.0 构建，
# FRB 强制 codegen/runtime 版本精确一致，需钉死小版本。
dependency_overrides:
  flutter_rust_bridge: 2.12.0

